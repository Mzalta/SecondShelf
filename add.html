<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new textbook listing to BookSwap">
    <title>Add Book - BookSwap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Navigation -->
    <header class="main-header">
        <nav class="main-nav">
            <div class="logo">
                <h1>📚 BookSwap</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="add.html" class="active">Add Book</a></li>
                <li><a href="favorites.html">Favorites</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Form Section -->
        <section class="add-book-section">
            <h2 class="section-heading">Add a New Book Listing</h2>
            
            <form id="add-book-form" class="book-form">
                <!-- Title Field -->
                <div class="form-group">
                    <label for="book-title" class="form-label">Book Title <span class="required">*</span></label>
                    <input type="text" id="book-title" name="book-title" class="form-input" required placeholder="e.g., Introduction to Computer Science">
                </div>

                <!-- Author Field -->
                <div class="form-group">
                    <label for="book-author" class="form-label">Author <span class="required">*</span></label>
                    <input type="text" id="book-author" name="book-author" class="form-input" required placeholder="e.g., John Smith">
                </div>

                <!-- Course Field -->
                <div class="form-group">
                    <label for="book-course" class="form-label">Course <span class="required">*</span></label>
                    <input type="text" id="book-course" name="book-course" class="form-input" required placeholder="e.g., CS 101, ENG 201">
                </div>

                <!-- Price/Trade Field -->
                <div class="form-group">
                    <label for="book-price" class="form-label">Price <span class="required">*</span></label>
                    <input type="text" id="book-price" name="book-price" class="form-input" required placeholder="e.g., $50 or Trade">
                </div>

                <!-- Contact Info Field -->
                <div class="form-group">
                    <label for="contact-info" class="form-label">Contact Information <span class="required">*</span></label>
                    <input type="text" id="contact-info" name="contact-info" class="form-input" required placeholder="e.g., email@school.edu or @username">
                </div>

                <!-- Your Name Field (for ownership) -->
                <div class="form-group">
                    <label for="poster-name" class="form-label">Your Name <span class="required">*</span></label>
                    <input type="text" id="poster-name" name="poster-name" class="form-input" required placeholder="e.g., John Doe">
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Listing</button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>

            <!-- Success Message (hidden by default) -->
            <div id="success-message" class="success-message hidden">
                <p>✓ Book listing added successfully!</p>
                <a href="index.html" class="btn btn-primary">View Listings</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <p>&copy; 2024 BookSwap. Helping students save money on textbooks.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
