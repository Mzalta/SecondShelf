<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your saved favorite book listings on SecondShelf">
    <title>Favorites - SecondShelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Navigation -->
    <header class="main-header">
        <nav class="main-nav">
            <div class="logo">
                <h1>📚 SecondShelf</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="add.html">Add Book</a></li>
                <li><a href="favorites.html" class="active">Favorites</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Favorites Section -->
        <section class="favorites-section">
            <h2 class="section-heading">Your Saved Favorites</h2>
            <div id="favorite-listings" class="book-listings">
                <!-- Saved book cards will be dynamically inserted here by JavaScript -->
                <div class="no-listings">
                    <p>You haven't saved any favorites yet.</p>
                    <a href="index.html" class="btn btn-primary">Browse Listings</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <p>&copy; 2024 SecondShelf. Helping students save money on textbooks.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
